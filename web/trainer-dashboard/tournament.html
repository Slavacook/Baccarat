<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baccarat Trainer — турнир</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="public-tournament-page">
  <div class="layout">
    <header id="tournament-public-hero" class="tournament-hero">
      <p class="tournament-hero-brand">Baccarat Trainer</p>
      <h1 id="tournament-public-title" class="tournament-hero-title">Турнир</h1>
      <p id="tournament-public-meta" class="tournament-meta">Статус: —</p>
      <p id="tournament-page-error" class="error hidden"></p>
    </header>

    <section id="tournament-public-podium-card" class="card tournament-podium-card hidden">
      <div class="tournament-leaderboard-head">
        <h2>Призовые места</h2>
      </div>
      <div id="tournament-public-podium" class="tournament-podium"></div>
    </section>

    <section id="tournament-public-leaderboard-card" class="card tournament-leaderboard-card hidden">
      <div class="tournament-leaderboard-head">
        <h2>Полный рейтинг</h2>
      </div>
      <div id="tournament-public-leaderboard-list" class="tournament-leaderboard-list"></div>
      <p id="tournament-public-leaderboard-empty" class="muted hidden">Пока нет успешных результатов</p>
    </section>
  </div>

  <script src="./tournament.js" type="module"></script>
</body>
</html>
