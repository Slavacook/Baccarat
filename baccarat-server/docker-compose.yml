version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./app:/code/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - baccarat

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baccarat
      POSTGRES_PASSWORD: baccarat
      POSTGRES_DB: baccarat_trainer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - baccarat

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - baccarat

volumes:
  postgres_data:

networks:
  baccarat:
    driver: bridge
