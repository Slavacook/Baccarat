# Конфигурация Nginx для Godot HTML5 игры
# Файл: /etc/nginx/sites-available/baccarat-trainer.ru
# 
# Инструкция по установке:
# 1. Скопируйте этот файл на сервер: sudo cp nginx_config.conf /etc/nginx/sites-available/baccarat-trainer.ru
# 2. Создайте символическую ссылку: sudo ln -s /etc/nginx/sites-available/baccarat-trainer.ru /etc/nginx/sites-enabled/
# 3. Проверьте конфигурацию: sudo nginx -t
# 4. Перезапустите nginx: sudo systemctl restart nginx

server {
    listen 80;
    listen [::]:80;
    server_name baccarat-trainer.ru www.baccarat-trainer.ru;

    root /var/www/baccarat-trainer.ru;
    index index.html;

    # Основная локация
    location / {
        try_files $uri $uri/ /index.html;
    }

    # MIME-типы для Godot файлов
    location ~ \.wasm$ {
        add_header Content-Type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.pck$ {
        add_header Content-Type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Gzip сжатие (уменьшает размер в 2-3 раза)
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/wasm
        application/octet-stream;

    # Кэширование статических файлов
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf|wasm|pck)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Защита от доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Если у вас уже настроен HTTPS, добавьте этот блок:
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name baccarat-trainer.ru www.baccarat-trainer.ru;
#
#     ssl_certificate /path/to/certificate.crt;
#     ssl_certificate_key /path/to/private.key;
#
#     # Остальные настройки такие же, как выше
#     root /var/www/baccarat-trainer.ru;
#     index index.html;
#     ...
# }
